# Streamlit theme and server settings for Ola Ride Insights.
# Sidebar colours use the [theme.sidebar] table (Streamlit >= 1.46).
[theme]
base = "light"
primaryColor = "#0F1A17"
backgroundColor = "#F4F6F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1A17"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0F1A17"
secondaryBackgroundColor = "#1B2A26"
textColor = "#E8EFE9"
primaryColor = "#C6E22A"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
